name: Update WDL grammar

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The update script uses only Node built-ins (fetch, fs), so no install.
      - run: node packages/ui/scripts/update-grammar.mjs
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: packages/ui/src/lib/wdl.tmGrammar.json
          branch: chore/update-wdl-grammar
          delete-branch: true
          commit-message: "chore: update WDL TextMate grammar from upstream"
          title: "chore: update WDL TextMate grammar"
          body: |
            Automated weekly refresh of the vendored WDL grammar from
            [`stjude-rust-labs/sprocket-vscode`](https://github.com/stjude-rust-labs/sprocket-vscode)
            via `npm run update-grammar`.

            Opened only because the upstream grammar changed. Review and merge to
            pick up the latest WDL syntax highlighting.
